<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Payment</title>
<link rel="stylesheet" href="./style/payfees.css">

</head>

<body>

<form class="payment-container">
    <h2>Fee Payment</h2>

    <div class="amount">Amount: ₹5000</div>

    <div class="input-group">
        <label>Card Number</label>
        <input type="text" placeholder="1234 5678 9012 3456" required>
    </div>

    <div class="input-group">
        <label>Card Holder Name</label>
        <input type="text" placeholder="John Doe" required >
    </div>

    <div class="row">
        <div class="input-group">
            <label>Expiry</label>
            <input type="text" placeholder="MM/YY"  required>
        </div>

        <div class="input-group">
            <label>CVV</label>
            <input type="password" placeholder="123" required>
        </div>
    </div>

    <button class="pay-btn" type="submit">Pay Now</button>
</form>

</body>
</html>
