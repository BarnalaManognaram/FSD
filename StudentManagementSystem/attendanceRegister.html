<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Attendance Portal</title>
<style>
body { font-family: Arial; background:#f4f6f9; margin:0; }
header { background: #10b981;; color:#fff; padding:15px; text-align:center; font-size:20px; }
.container { max-width:900px; margin:auto; padding:20px; }
.card { background:#fff; padding:15px; border-radius:10px; margin-bottom:15px; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
table { width:100%; border-collapse:collapse; }
th, td { padding:10px; text-align:center; border-bottom:1px solid #ddd; }
th { background: #10b981;; color:white; }
.eye { cursor:pointer; color: #10b981;; font-weight:bold; }
.calendar { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin-top:10px; }
.day { padding:10px; border-radius:6px; font-size:12px; }
.present { background:#d4edda; color:#155724; }
.absent { background:#f8d7da; color:#721c24; }

button {
  padding: 6px 12px;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  justify-self: center;
  align-items: center;

}
</style>
</head>
<body>

<header>Student Attendance</header>

<div class="container">

<div class="card">
<h3>Subjects</h3>
<table>
<thead>
<tr>
<th>Subject</th>
<th>Attendance %</th>
<th>View</th>
</tr>
</thead>
<tbody id="subjectTable"></tbody>
</table>
</div>

<div class="card" id="detailsCard" style="display:none;">
<h3 id="subjectTitle"></h3>
<div id="calendar" class="calendar"></div>
</div>

</div>

<script>
const subjects = [
  { id:1, name:"Math" },
  { id:2, name:"Physics" },
  { id:3, name:"Chemistry" }
];

// sample data per subject
const attendance = {
  1: {
    "2026-04-01":"P","2026-04-02":"A","2026-04-03":"P","2026-04-04":"P"
  },
  2: {
    "2026-04-01":"A","2026-04-02":"A","2026-04-03":"P"
  },
  3: {
    "2026-04-01":"P","2026-04-02":"P","2026-04-03":"P"
  }
};

function renderSubjects(){
  const table = document.getElementById("subjectTable");
  table.innerHTML="";

  subjects.forEach(sub=>{
    const records = attendance[sub.id] || {};
    const total = Object.keys(records).length;
    const present = Object.values(records).filter(v=>v==='P').length;
    const percent = total ? ((present/total)*100).toFixed(1):0;

    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${sub.name}</td>
      <td>${percent}%</td>
      <td><span class="eye" onclick="viewDetails(${sub.id}, '${sub.name}')">👁</span></td>
    `;

    table.appendChild(row);
  });
}

function viewDetails(subjectId, name){
  document.getElementById("detailsCard").style.display="block";
  document.getElementById("subjectTitle").innerText = name + " - Monthly Attendance";

  const cal = document.getElementById("calendar");
  cal.innerHTML="";

  const year = 2026;
  const month = 3; // April (0-based)

  const days = new Date(year, month+1, 0).getDate();
  const records = attendance[subjectId] || {};

  for(let d=1; d<=days; d++){
    const formattedDate = `${d}-4-${year}`;
    const date = `${year}-04-${String(d).padStart(2,'0')}`;
    const status = records[date] || 'A';

    const div = document.createElement("div");
    div.className = "day " + (status==='P' ? 'present':'absent');
    div.innerText = formattedDate + "\n" + status;

    cal.appendChild(div);
  }
}

renderSubjects();
</script>
<button onclick="window.location.href='./Home.html'">⬅ Back</button>
</body>
</html>
