<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attendance Portal</title>

<style>

body{
  font-family: Arial, sans-serif;
  background:#f4f6f9;
  margin:0;
}

header{
  background:#10b981;
  color:white;
  padding:15px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  padding:20px;
  border-radius:10px;
  margin-bottom:20px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

table{
  width:100%;
  border-collapse:collapse;
}

th, td{
  border:1px solid #ddd;
  padding:12px;
  text-align:center;
}

th{
  background:#10b981;
  color:white;
}

.eye{
  cursor:pointer;
  font-size:18px;
  color:#10b981;
}

.present{
  background:#d4edda;
  color:#155724;
  font-weight:bold;
}

.absent{
  background:#f8d7da;
  color:#721c24;
  font-weight:bold;
}

button{
  padding:10px 16px;
  border:none;
  background:#10b981;
  color:white;
  border-radius:6px;
  cursor:pointer;
  margin-top:15px;
}

button:hover{
  background:#059669;
}

</style>

</head>

<body>

<header>
  Student Attendance Portal
</header>

<div class="container">

  <!-- SUBJECT LIST -->
  <div class="card" id="subjectCard">

    <h2>Current Semester Courses</h2>

    <table>

      <thead>

        <tr>
          <th>Course Name</th>
          <th>Course Code</th>
          <th>Attendance %</th>
          <th>View</th>
        </tr>

      </thead>

      <tbody id="subjectTable"></tbody>

    </table>

    <button onclick="window.location.href='./Home.html'">
      ⬅ Back
    </button>

  </div>

  <!-- ATTENDANCE DETAILS -->
  <div
    class="card"
    id="attendanceCard"
    style="display:none;"
  >

    <h2 id="courseTitle"></h2>

    <table>

      <thead>

        <tr>
          <th>Date</th>
          <th>Status</th>
        </tr>

      </thead>

      <tbody id="attendanceTable"></tbody>

    </table>

    <button onclick="goBack()">
      ⬅ Back
    </button>

  </div>

</div>

<script>

// =====================================
// USER DATA FROM SESSION STORAGE
// =====================================

const userData =
  JSON.parse(
    sessionStorage.getItem("userData")
  );

// =====================================
// CURRENT SEM COURSES
// =====================================

const subjects =
  userData.currentCourses || [];

// =====================================
// SAMPLE ATTENDANCE
// LATER FETCH FROM BACKEND
// =====================================

const attendanceData = {

  "CS201": [
    {
      date:"01-04-2026",
      status:"P"
    },
    {
      date:"02-04-2026",
      status:"A"
    },
    {
      date:"03-04-2026",
      status:"P"
    }
  ],

  "CS202": [
    {
      date:"01-04-2026",
      status:"P"
    },
    {
      date:"02-04-2026",
      status:"P"
    },
    {
      date:"03-04-2026",
      status:"P"
    }
  ]

};

// =====================================
// RENDER COURSES
// =====================================

function renderSubjects(){

  const table =
    document.getElementById("subjectTable");

  table.innerHTML = "";

  if(subjects.length === 0){

    table.innerHTML = `
      <tr>
        <td colspan="4">
          No current semester courses found
        </td>
      </tr>
    `;

    return;
  }

  subjects.forEach((subject, index) => {

    const records =
      attendanceData[
        subject.courseCode
      ] || [];

    const total =
      records.length;

    const present =
      records.filter(
        r => r.status === "P"
      ).length;

    const percent =
      total
      ? ((present / total) * 100).toFixed(1)
      : 0;

    const row =
      document.createElement("tr");

    row.innerHTML = `

      <td>${subject.courseName}</td>

      <td>${subject.courseCode}</td>

      <td>${percent}%</td>

      <td>

        <span
          class="eye"
          onclick="viewAttendance(${index})"
        >
          👁
        </span>

      </td>

    `;

    table.appendChild(row);

  });
}

// =====================================
// VIEW ATTENDANCE REGISTER
// =====================================

function viewAttendance(index){

  const subject =
    subjects[index];

  document.getElementById("subjectCard")
    .style.display = "none";

  document.getElementById("attendanceCard")
    .style.display = "block";

  document.getElementById("courseTitle")
    .innerText =
      `${subject.courseName} Attendance Register`;

  const table =
    document.getElementById("attendanceTable");

  table.innerHTML = "";

  // =====================================
  // LATER FETCH FROM BACKEND
  // Example:
  //
  // fetch(`/attendance/${subject.courseCode}`)
  // =====================================

  const records =
    attendanceData[
      subject.courseCode
    ] || [];

  if(records.length === 0){

    table.innerHTML = `
      <tr>
        <td colspan="2">
          No attendance found
        </td>
      </tr>
    `;

    return;
  }

  records.forEach(record => {

    const row =
      document.createElement("tr");

    row.innerHTML = `

      <td>${record.date}</td>

      <td
        class="${
          record.status === "P"
            ? "present"
            : "absent"
        }"
      >
        ${record.status}
      </td>

    `;

    table.appendChild(row);

  });
}

// =====================================
// GO BACK
// =====================================

function goBack(){

  document.getElementById("attendanceCard")
    .style.display = "none";

  document.getElementById("subjectCard")
    .style.display = "block";
}

// =====================================
// INITIAL LOAD
// =====================================

renderSubjects();

</script>

</body>
</html>
