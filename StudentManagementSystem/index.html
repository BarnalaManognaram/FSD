<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Splash Screen</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      overflow:hidden;
    }

    /* Splash Screen */
    #splash{
      width:100%;
      height:100vh;
      background:linear-gradient(135deg,#0f172a,#1e3a8a);
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      color:white;
    }

    /* Logo Circle */
    .logo{
      width:120px;
      height:120px;
      border-radius:50%;
      background:white;
      color:#1e3a8a;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:40px;
      font-weight:bold;
      animation:zoom 2s infinite alternate;
      box-shadow:0 0 30px rgba(255,255,255,0.4);
    }

    /* Text */
    h1{
      margin-top:25px;
      font-size:42px;
      letter-spacing:2px;
      animation:fadeIn 2s ease-in-out;
    }

    p{
      margin-top:10px;
      font-size:18px;
      opacity:0.8;
    }

    /* Loader */
    .loader{
      margin-top:30px;
      width:60px;
      height:60px;
      border:6px solid rgba(255,255,255,0.3);
      border-top:6px solid white;
      border-radius:50%;
      animation:spin 1s linear infinite;
    }

    /* Animations */

    @keyframes spin{
      100%{
        transform:rotate(360deg);
      }
    }

    @keyframes zoom{
      from{
        transform:scale(1);
      }
      to{
        transform:scale(1.1);
      }
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

  </style>
</head>
<body>

  <div id="splash">

    <div class="logo">
      SP
    </div>

    <h1>Student Portal</h1>

    <p>Loading...</p>

    <div class="loader"></div>

  </div>

  <script>

    // Example API call
    async function loadApp() {
    const user = sessionStorage.getItem('userData') ? JSON.parse(sessionStorage.getItem('userData')): null;   
    if(user) {

      try {
        const response = await fetch(`http://localhost:3000/${user.regNo}`);
        
        const data = await response.json();
        sessionStorage.setItem('userData', JSON.stringify(data.data)); // Update sessionStorage with latest user data
        console.log("User Data Loaded:", JSON.parse(sessionStorage.getItem('userData')));

        window.location.href = "home.html";

      } catch(error) {

        console.log("API Error:", error);

      }
    } else {
      console.log("No user data found in sessionStorage."); 
      window.location.href = "./login.html";     
    }

      // Remove splash screen after 3 sec
      setTimeout(() => {

        document.getElementById("splash").style.display = "none";

      }, 3000);

    }

    window.addEventListener("DOMContentLoaded", loadApp);

  </script>

</body>
</html>
