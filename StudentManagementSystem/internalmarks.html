<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Portal</title>

<style>

body{
  font-family: Arial, sans-serif;
  background:#f4f6f9;
  margin:0;
  padding:0;
}

header{
  background:#10b981;
  color:white;
  padding:15px;
  text-align:center;
  font-size:24px;
  font-weight:bold;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  padding:20px;
  border-radius:10px;
  margin-bottom:20px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

table{
  width:100%;
  border-collapse:collapse;
}

th, td{
  padding:12px;
  text-align:center;
  border-bottom:1px solid #ddd;
}

th{
  background:#10b981;
  color:white;
}

.eye{
  cursor:pointer;
  font-size:18px;
}

button{
  padding:10px 16px;
  border:none;
  background:#10b981;
  color:white;
  border-radius:6px;
  cursor:pointer;
  margin-top:15px;
}

button:hover{
  background:#059669;
}

.loading{
  text-align:center;
  font-size:18px;
  padding:20px;
}

</style>

</head>

<body>

<header>
  Student Internal Marks Portal
</header>

<div class="container">

  <!-- SUBJECT LIST -->
  <div class="card" id="subjectCard">

    <h2>Current Year Courses</h2>

    <table>

      <thead>
        <tr>
          <th>Course Name</th>
          <th>Course Code</th>
          <th>Marks</th>
          <th>Grade</th>
          <th>View</th>
        </tr>
      </thead>

      <tbody id="subjectTable">

        <tr>
          <td colspan="5" class="loading">
            Loading courses...
          </td>
        </tr>

      </tbody>

    </table>
    <button onclick="window.location.href='Home.html'">
      ⬅ Back
    </button>
  </div>

  <!-- DETAILS CARD -->
  <div
    class="card"
    id="detailsCard"
    style="display:none;"
  >

    <h2 id="subjectTitle"></h2>

    <table>

      <thead>
        <tr>
          <th>Field</th>
          <th>Value</th>
        </tr>
      </thead>

      <tbody id="marksTable"></tbody>

    </table>

    <button onclick="goBack()">
      ⬅ Back
    </button>

  </div>

</div>

<script>

// ==========================
// Backend API URL
// ==========================

// Example:
// Save regNo after login:
// localStorage.setItem("regNo", user.regNo);

const regNo =
  localStorage.getItem("regNo") || "251fb04003";

const API_URL =
  `http://localhost:3000/currentCourses/${regNo}`;

// ==========================
// Store courses
// ==========================

let subjects = [];

// ==========================
// Fetch courses from backend
// ==========================

async function fetchCourses(){

  try{

    const response = await fetch(API_URL);

    const result = await response.json();

    if(!result.success){

      alert(result.message);

      return;
    }

    subjects = result.data;

    renderSubjects();

  }
  catch(error){

    console.error(error);

    alert("Failed to fetch courses");
  }
}

// ==========================
// Render subject list
// ==========================

function renderSubjects(){

  const table =
    document.getElementById("subjectTable");

  table.innerHTML = "";

  if(subjects.length === 0){

    table.innerHTML = `
      <tr>
        <td colspan="5">
          No courses found
        </td>
      </tr>
    `;

    return;
  }

  subjects.forEach((sub, index) => {

    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${sub.courseName}</td>
      <td>${sub.courseCode}</td>
      <td>${sub.marks}</td>
      <td>${sub.grade}</td>
      <td>
        <span
          class="eye"
          onclick="viewDetails(${index})"
        >
          👁
        </span>
      </td>
    `;

    table.appendChild(row);

  });
}

// ==========================
// View subject details
// ==========================

function viewDetails(index){

  const subject = subjects[index];

  document.getElementById("subjectCard")
    .style.display = "none";

  document.getElementById("detailsCard")
    .style.display = "block";

  document.getElementById("subjectTitle")
    .innerText =
      `${subject.courseName} Details`;

  const table =
    document.getElementById("marksTable");

  table.innerHTML = `
    <tr>
      <td>Course Name</td>
      <td>${subject.courseName}</td>
    </tr>

    <tr>
      <td>Course Code</td>
      <td>${subject.courseCode}</td>
    </tr>

    <tr>
      <td>Year</td>
      <td>${subject.year}</td>
    </tr>

    <tr>
      <td>Semester</td>
      <td>${subject.semester || "N/A"}</td>
    </tr>

    <tr>
      <td>Marks</td>
      <td>${subject.marks}</td>
    </tr>

    <tr>
      <td>Grade</td>
      <td>${subject.grade}</td>
    </tr>
  `;
}

// ==========================
// Back to subjects
// ==========================

function goBack(){

  document.getElementById("detailsCard")
    .style.display = "none";

  document.getElementById("subjectCard")
    .style.display = "block";
}

// ==========================
// Initial Load
// ==========================

fetchCourses();

</script>

</body>
</html>
