<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Portal</title>
<style>
body { font-family: Arial; background:#f4f6f9; margin:0; }
header { background:#4a90e2; color:#fff; padding:15px; text-align:center; font-size:20px; }
.container { max-width:900px; margin:auto; padding:20px; }
.card { background:#fff; padding:15px; border-radius:10px; margin-bottom:15px; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
table { width:100%; border-collapse:collapse; }
th, td { padding:10px; text-align:center; border-bottom:1px solid #ddd; }
th { background:#4a90e2; color:white; }
.eye { cursor:pointer; color:#4a90e2; font-weight:bold; }
button {
  padding: 6px 12px;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  justify-self: center;
  align-items: center;

}
</style>
</head>
<body>

<header>Student Internal Marks Portal</header>

<div class="container">

<!-- SUBJECT LIST -->
<div class="card" id="subjectCard">
<h3>Subjects</h3>
<table>
<thead>
<tr>
<th>Subject</th>
<th>Average Marks</th>
<th>View</th>
</tr>
</thead>
<tbody id="subjectTable"></tbody>
</table>
</div>

<!-- DETAILS -->
<div class="card" id="detailsCard" style="display:none;">
<h3 id="subjectTitle"></h3>
<table>
<thead>
<tr>
<th>Exam</th>
<th>Marks</th>
<th>Total</th>
</tr>
</thead>
<tbody id="marksTable"></tbody>
</table>
</div>

</div>

<script>
const subjects = [
  { id:1, name:"Math" },
  { id:2, name:"Physics" },
  { id:3, name:"Chemistry" }
];

// sample marks data
const marksData = {
  1: [
    { exam:"Mid 1", marks:24, total:30 },
    { exam:"Mid 2", marks:26, total:30 },
    { exam:"Assignment", marks:18, total:20 }
  ],
  2: [
    { exam:"Mid 1", marks:20, total:30 },
    { exam:"Mid 2", marks:22, total:30 }
  ],
  3: [
    { exam:"Mid 1", marks:25, total:30 },
    { exam:"Mid 2", marks:27, total:30 }
  ]
};

function renderSubjects(){
  const table = document.getElementById("subjectTable");
  table.innerHTML="";

  subjects.forEach(sub=>{
    const records = marksData[sub.id] || [];
    const totalMarks = records.reduce((sum,r)=>sum+r.marks,0);
    const totalMax = records.reduce((sum,r)=>sum+r.total,0);
    const percent = totalMax ? ((totalMarks/totalMax)*100).toFixed(1):0;

    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${sub.name}</td>
      <td>${percent}%</td>
      <td><span class="eye" onclick="viewDetails(${sub.id}, '${sub.name}')">👁</span></td>
    `;

    table.appendChild(row);
  });
}

function viewDetails(id, name){
  document.getElementById("detailsCard").style.display="block";
  document.getElementById("subjectCard").style.display="none";
  document.getElementById("subjectTitle").innerText = name + " - Internal Marks";

  const table = document.getElementById("marksTable");
  table.innerHTML="";

  const records = marksData[id] || [];

  records.forEach(r=>{
    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${r.exam}</td>
      <td>${r.marks}</td>
      <td>${r.total}</td>
    `;
    table.appendChild(row);
  });
}

function goBack(){
  document.getElementById("detailsCard").style.display="none";
  document.getElementById("subjectCard").style.display="block";
}

renderSubjects();
</script>
<button onclick="window.location.href='./Home.html'">⬅ Back</button>
</body>
</html>
