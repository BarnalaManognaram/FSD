<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Internal Marks Portal</title>

<style>

body{
  font-family: Arial, sans-serif;
  background:#f4f6f9;
  margin:0;
  padding:0;
}

header{
  background:#10b981;
  color:white;
  padding:18px;
  text-align:center;
  font-size:26px;
  font-weight:bold;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  padding:20px;
  border-radius:10px;
  margin-bottom:20px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

table{
  width:100%;
  border-collapse:collapse;
}

th, td{
  padding:12px;
  text-align:center;
  border-bottom:1px solid #ddd;
}

th{
  background:#10b981;
  color:white;
}

.eye{
  cursor:pointer;
  font-size:20px;
}

button{
  padding:10px 16px;
  border:none;
  background:#10b981;
  color:white;
  border-radius:6px;
  cursor:pointer;
  margin-top:15px;
}

button:hover{
  background:#059669;
}

.loading{
  text-align:center;
  font-size:18px;
  padding:20px;
}

.details-table td{
  text-align:left;
}

</style>

</head>

<body>

<header>
  Student Internal Marks Portal
</header>

<div class="container">

  <!-- COURSE LIST -->
  <div class="card" id="subjectCard">

    <h2>Current Courses</h2>

    <table>

      <thead>

        <tr>
          <th>Course Name</th>
          <th>Course Code</th>
          <th>View</th>
        </tr>

      </thead>

      <tbody id="subjectTable">

        <tr>
          <td colspan="3" class="loading">
            Loading current courses...
          </td>
        </tr>

      </tbody>

    </table>

    <button onclick="window.location.href='Home.html'">
      ⬅ Back
    </button>

  </div>

  <!-- DETAILS -->
  <div
    class="card"
    id="detailsCard"
    style="display:none;"
  >

    <h2 id="subjectTitle"></h2>

    <table class="details-table">

      <thead>

        <tr>
          <th>Field</th>
          <th>Value</th>
        </tr>

      </thead>

      <tbody id="marksTable"></tbody>

    </table>

    <button onclick="goBack()">
      ⬅ Back
    </button>

  </div>

</div>

<script>

// =====================================
// STORE COURSES
// =====================================

let subjects = [];

// =====================================
// LOAD COURSES FROM SESSION STORAGE
// =====================================

function fetchCourses(){

  try{

    // Get user data
    const userData =
      JSON.parse(
        sessionStorage.getItem("userData")
      );

    // Check if user data exists
    if(!userData){

      alert("No user data found");

      return;
    }

    // Get current courses
    subjects =
      userData.currentCourses || [];

    // Render courses
    renderSubjects();

  }
  catch(error){

    console.error(error);

    alert("Failed to load current courses");

  }
}

// =====================================
// RENDER SUBJECTS
// =====================================

function renderSubjects(){

  const table =
    document.getElementById("subjectTable");

  table.innerHTML = "";

  // No courses
  if(subjects.length === 0){

    table.innerHTML = `
      <tr>
        <td colspan="3">
          No current courses found
        </td>
      </tr>
    `;

    return;
  }

  // Loop courses
  subjects.forEach((sub, index) => {

    const row =
      document.createElement("tr");

    row.innerHTML = `

      <td>${sub.courseName}</td>

      <td>${sub.courseCode}</td>

      <td>

        <span
          class="eye"
          onclick="viewDetails(${index})"
        >
          👁
        </span>

      </td>
    `;

    table.appendChild(row);

  });
}

// =====================================
// VIEW DETAILS
// =====================================

function viewDetails(index){

  const subject = subjects[index];

  // Hide subject list
  document.getElementById("subjectCard")
    .style.display = "none";

  // Show details
  document.getElementById("detailsCard")
    .style.display = "block";

  // Set title
  document.getElementById("subjectTitle")
    .innerText =
      `${subject.courseName} Internal Marks`;

  const table =
    document.getElementById("marksTable");

  // Render details
  table.innerHTML = `

    <tr>
      <td>Course Name</td>
      <td>${subject.courseName}</td>
    </tr>

    <tr>
      <td>Course Code</td>
      <td>${subject.courseCode}</td>
    </tr>

    <tr>
      <td>Year</td>
      <td>${subject.year}</td>
    </tr>

    <tr>
      <td>Semester</td>
      <td>${subject.semester}</td>
    </tr>

    <tr>
      <td>T1</td>
      <td>${subject.T1}</td>
    </tr>

    <tr>
      <td>T2</td>
      <td>${subject.T2}</td>
    </tr>

    <tr>
      <td>T3</td>
      <td>${subject.T3}</td>
    </tr>

    <tr>
      <td>T4</td>
      <td>${subject.T4}</td>
    </tr>

    <tr>
      <td>T5_1</td>
      <td>${subject.T5_1}</td>
    </tr>

    <tr>
      <td>T5_2</td>
      <td>${subject.T5_2}</td>
    </tr>

    <tr>
      <td>T5_3</td>
      <td>${subject.T5_3}</td>
    </tr>

    <tr>
      <td>T5_4</td>
      <td>${subject.T5_4}</td>
    </tr>

  `;
}

// =====================================
// BACK BUTTON
// =====================================

function goBack(){

  document.getElementById("detailsCard")
    .style.display = "none";

  document.getElementById("subjectCard")
    .style.display = "block";
}

// =====================================
// INITIAL LOAD
// =====================================

fetchCourses();

</script>

</body>
</html>
